<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Команда за $20</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
  <script>
    // Тема ставится до отрисовки, чтобы не было вспышки
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="top">
    <h1>Команда за <span class="accent">$20</span></h1>
    <div class="subtitle">Аукцион · 1 на 1</div>
    <div class="top-actions">
    <button id="btn-menu" class="icon-btn hidden" aria-label="Выйти в меню" title="Выйти в меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
    </button>
    <button id="theme-toggle" class="icon-btn theme-toggle" aria-label="Сменить тему" title="Сменить тему">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    </div>
  </header>

  <!-- Экран старта -->
  <main id="screen-setup" class="screen">
    <div class="panel setup">
      <p class="lead">Два игрока с одинаковым бюджетом. Из скрытого пула по очереди выставляются футболисты — торгуйтесь, пока кто-то не спасует.</p>
      <div class="names">
        <label>Игрок 1<input id="name1" maxlength="16" value="Игрок 1"></label>
        <label>Игрок 2<input id="name2" maxlength="16" value="Игрок 2"></label>
      </div>
      <div class="modes-title">Формат</div>
      <div class="modes cols-3" id="formats"></div>
      <div id="schemes-wrap" class="hidden">
        <div class="modes-title">Схема</div>
        <div class="modes cols-2" id="schemes"></div>
      </div>
      <div class="modes-title">Рейтинг</div>
      <div class="modes" id="modes"></div>
      <p class="muted squad-desc" id="squad-desc"></p>
      <button id="btn-play" class="btn primary big" disabled>Загрузка базы…</button>
      <p id="load-error" class="error hidden"></p>
    </div>
  </main>

  <!-- Экран игры -->
  <main id="screen-game" class="screen hidden">
    <section class="team" id="team-0"></section>

    <section class="center">
      <div class="lot-info" id="lot-info"></div>
      <div class="card-wrap" id="card"></div>

      <div class="bid-box" id="bid-box">
        <div class="current-bid">
          <span class="muted">Текущая ставка</span>
          <strong id="current-bid">—</strong>
          <span id="current-leader" class="muted"></span>
        </div>
        <div class="turn" id="turn"></div>
        <div class="controls" id="controls">
          <div class="stepper">
            <button class="btn step" data-step="-1">−</button>
            <span id="bid-amount">$1</span>
            <button class="btn step" data-step="1">+</button>
            <button class="btn step" data-step="5">+5</button>
          </div>
          <div class="actions">
            <button id="btn-bid" class="btn primary">Поставить</button>
            <button id="btn-pass" class="btn">Пас — отдать</button>
          </div>
        </div>
      </div>

      <div class="result hidden" id="result">
        <p id="result-text"></p>
        <button id="btn-next" class="btn primary">Следующий лот →</button>
      </div>

      <ol class="log" id="log"></ol>
    </section>

    <section class="team" id="team-1"></section>
  </main>

  <!-- Финал -->
  <main id="screen-end" class="screen hidden">
    <div class="panel end">
      <h2 id="end-title"></h2>
      <div class="final-teams" id="final-teams"></div>
      <button id="btn-again" class="btn primary big">Новая игра</button>
    </div>
  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
